services:
  web:
    build:
      context: .
    container_name: idea-workbench
    restart: unless-stopped
    environment:
      PORT: "8080"
      IDEA_DESK_REQUIRE_AUTH: "${IDEA_DESK_REQUIRE_AUTH:-false}"
      IDEA_DESK_USERNAME: "${IDEA_DESK_USERNAME:-}"
      IDEA_DESK_PASSWORD: "${IDEA_DESK_PASSWORD:-}"
      IDEA_DESK_WEEKLY_REPORT_ENABLED: "${IDEA_DESK_WEEKLY_REPORT_ENABLED:-true}"
      IDEA_DESK_WEEKLY_MAX_ATTEMPTS: "${IDEA_DESK_WEEKLY_MAX_ATTEMPTS:-3}"
      IDEA_DESK_WEEKLY_RETRY_SECONDS: "${IDEA_DESK_WEEKLY_RETRY_SECONDS:-300}"
      IDEA_DESK_SMTP_SECURITY: "${IDEA_DESK_SMTP_SECURITY:-starttls}"
      IDEA_DESK_SMTP_HOST: "${IDEA_DESK_SMTP_HOST:-}"
      IDEA_DESK_SMTP_PORT: "${IDEA_DESK_SMTP_PORT:-}"
      IDEA_DESK_SMTP_USERNAME: "${IDEA_DESK_SMTP_USERNAME:-}"
      IDEA_DESK_SMTP_PASSWORD: "${IDEA_DESK_SMTP_PASSWORD:-}"
      IDEA_DESK_SMTP_FROM: "${IDEA_DESK_SMTP_FROM:-}"
      IDEA_DESK_WEEKLY_RECIPIENTS: "${IDEA_DESK_WEEKLY_RECIPIENTS:-}"
      IDEA_DESK_SMTP_TIMEOUT_SECONDS: "${IDEA_DESK_SMTP_TIMEOUT_SECONDS:-20}"
    ports:
      - "127.0.0.1:8184:8080"
    volumes:
      - ./data:/app/data
